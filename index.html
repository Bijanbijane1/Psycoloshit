  <body class="font-sans antialiased bg-[#F7F5F0] text-[#24243B] selection:bg-[#EAE4FF] selection:text-[#24243B]">
    <div id="root"></div>
    <script>
      (function () {
        var CURRENT_CACHE = 'psychology-pwa-v9';
        var RELOAD_FLAG = 'pm_sw_v9_activated';

        if ('caches' in window) {
          caches.keys().then(function (names) {
            var legacyCaches = names.filter(function (name) {
              return name !== CURRENT_CACHE;
            });
            if (legacyCaches.length > 0) {
              Promise.all(
                legacyCaches.map(function (name) {
                  return caches.delete(name);
                })
              ).then(function () {
                if (!sessionStorage.getItem(RELOAD_FLAG)) {
                  sessionStorage.setItem(RELOAD_FLAG, '1');
                  if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(function (regs) {
                      Promise.all(
                        regs.map(function (reg) {
                          return reg.update();
                        })
                      ).finally(function () {
                        window.location.reload();
                      });
                    });
                  } else {
                    window.location.reload();
                  }
                }
              });
            }
          });
        }

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (!sessionStorage.getItem(RELOAD_FLAG)) {
              sessionStorage.setItem(RELOAD_FLAG, '1');
              window.location.reload();
            }
          });
          window.addEventListener('load', function () {
            navigator.serviceWorker
              .register('/sw.js', { updateViaCache: 'none' })
              .then(function (reg) {
                reg.update();
              })
              .catch(function () {});
          });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
