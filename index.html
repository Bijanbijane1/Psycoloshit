    <meta property="og:title" content="مرجع جامع و هوشمند روان‌شناسی" />

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <body class="font-sans antialiased bg-slate-50 text-slate-900 selection:bg-indigo-100 selection:text-indigo-900">
    <div id="root"></div>
    <script>
      // Suppress benign Vite WebSocket/HMR disconnect errors in sandbox iframe environment
      window.addEventListener('error', (event) => {
        if (event.message && (event.message.includes('WebSocket') || event.message.includes('vite'))) {
          event.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', (event) => {
        if (event.reason && String(event.reason).includes('WebSocket')) {
          event.preventDefault();
        }
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
